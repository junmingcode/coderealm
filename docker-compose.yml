version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: blog_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blog_db
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: blog_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blog_backend
    environment:
      DATABASE_URL: mysql+pymysql://blog_user:blog_password@db:3306/blog_db
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_NAME: 码境 CodeRealm
      APP_DESCRIPTION: A personal blog built with FastAPI and React
      APP_VERSION: 1.0.0
      MAX_UPLOAD_SIZE: 5242880
      UPLOAD_DIR: uploads
      CORS_ORIGINS: http://localhost,http://localhost:80
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build: ./frontend
    container_name: blog_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/uploads:/var/www/uploads
    depends_on:
      - backend

volumes:
  db_data:
